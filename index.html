<!DOCTYPE html>
<html>
<head>
    <title>Tamil to English Voice Translator</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:60px;">

<h2>🎤 Tamil Speech → English Text</h2>

<button onclick="startRecognition()">Start Speaking</button>
<button onclick="stopRecognition()">Stop</button>

<p id="status">Status: Idle</p>

<h3>📝 Tamil Text:</h3>
<div id="tamil" style="border:1px solid #ccc; padding:10px; width:60%; margin:auto;"></div>

<h3>🌍 English Translation:</h3>
<div id="english" style="border:1px solid #ccc; padding:10px; width:60%; margin:auto;"></div>

<script>
let recognition;

function startRecognition() {

    if (!('webkitSpeechRecognition' in window)) {
        alert("Use Google Chrome browser");
        return;
    }

    recognition = new webkitSpeechRecognition();

    recognition.lang = "ta-IN"; // Tamil input
    recognition.continuous = true;

    document.getElementById("status").innerText = "Listening... 🎤";

    recognition.onresult = function(event) {
        let text = event.results[event.results.length - 1][0].transcript;

        document.getElementById("tamil").innerText = text;

        translateToEnglish(text);
    };

    recognition.onerror = function(event) {
        document.getElementById("status").innerText = "Error: " + event.error;
    };

    recognition.onend = function() {
        document.getElementById("status").innerText = "Stopped";
    };

    recognition.start();
}

function stopRecognition() {
    if (recognition) recognition.stop();
}

function translateToEnglish(text) {

    fetch(`https://api.mymemory.translated.net/get?q=${text}&langpair=ta|en`)
    .then(res => res.json())
    .then(data => {
        document.getElementById("english").innerText =
            data.responseData.translatedText;
    })
    .catch(() => {
        document.getElementById("english").innerText = "Translation error";
    });
}
</script>

</body>
</html>
